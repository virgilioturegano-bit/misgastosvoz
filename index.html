<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1518">
<title>Gastos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#0F1518;
  --surface:#18222A;
  --raised:#1F2C35;
  --line:#2B3A45;
  --text:#E7EDF2;
  --muted:#8397A4;
  --accent:#F5A524;
  --accent-ink:#1A1206;
  --paper:#E9E4D6;
  --danger:#E5484D;
  --mono:ui-monospace,"Roboto Mono","DejaVu Sans Mono",monospace;
  --sans:system-ui,Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:16px;line-height:1.4;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- cabecera ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--ink);
  padding:calc(14px + env(safe-area-inset-top)) 16px 0;
  border-bottom:1px solid var(--line);
}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.period{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.total{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
nav{display:flex;gap:2px;margin-top:14px}
nav button{
  flex:1;padding:9px 0 11px;font-size:13px;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent;
}
nav button[aria-current="true"]{color:var(--text);border-bottom-color:var(--accent)}
.nav-arrows{display:flex;align-items:center;gap:4px}
.nav-arrows button{
  width:34px;height:34px;border-radius:8px;background:var(--surface);
  font-family:var(--mono);font-size:15px;color:var(--muted);
}
.nav-arrows button:disabled{opacity:.3}

/* ---------- ticket ---------- */
main{padding:16px 12px 0;max-width:560px;margin:0 auto}
.ticket{background:var(--surface);border-radius:10px 10px 0 0;margin-bottom:0;overflow:hidden}
.ticket-head{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:13px 15px 9px;border-bottom:1px dashed var(--line);
}
.ticket-day{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ticket-sum{font-family:var(--mono);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.rows{padding:5px 15px 12px}
/* la línea de puntos es la firma: concepto ... importe, como en un ticket */
.row{display:flex;align-items:flex-end;gap:6px;padding:7px 0;width:100%;text-align:left}
.row .cat{
  width:7px;height:7px;border-radius:2px;flex:none;margin-bottom:5px;
}
.row .name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58%}
.row .lead{flex:1;border-bottom:1px dotted var(--line);margin-bottom:5px;min-width:14px}
.row .amt{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;flex:none}
/* borde dentado inferior, el corte del papel */
.tear{
  height:9px;margin-bottom:14px;
  background:radial-gradient(circle at 5px 9px, transparent 5px, var(--surface) 5.5px);
  background-size:14px 9px;background-repeat:repeat-x;
}

/* ---------- desglose ---------- */
.panel{background:var(--surface);border-radius:10px;padding:15px;margin-bottom:14px}
.panel h2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 12px;font-weight:500}
.bar-row{margin-bottom:13px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.bar-name{font-size:14px}
.bar-val{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.bar-pct{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.bar-track{height:5px;border-radius:3px;background:var(--raised);overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.spark{display:flex;align-items:flex-end;gap:5px;height:64px;margin-top:4px}
.spark div{flex:1;background:var(--raised);border-radius:3px 3px 0 0;position:relative;min-height:3px}
.spark div.on{background:var(--accent)}
.spark-labels{display:flex;gap:5px;margin-top:6px}
.spark-labels span{flex:1;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted)}

.empty{text-align:center;padding:44px 24px;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:6px;font-weight:600}

/* ---------- captura ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--ink) 62%,transparent);
}
.dock-inner{max-width:560px;margin:0 auto;display:flex;gap:9px;align-items:center}
.mic{
  flex:1;height:54px;border-radius:27px;background:var(--accent);color:var(--accent-ink);
  font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;
}
.mic:active{transform:scale(.98)}
.mic[data-listening="true"]{background:var(--danger);color:#fff}
.mic svg{width:20px;height:20px}
.type{
  width:54px;height:54px;border-radius:27px;background:var(--surface);
  border:1px solid var(--line);font-size:19px;flex:none;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.mic[data-listening="true"] svg{animation:pulse 1.1s ease-in-out infinite}

/* ---------- entrada manual ---------- */
.sheet{
  position:fixed;inset:0;z-index:40;background:rgba(6,10,12,.72);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet[hidden]{display:none}
.sheet-box{
  width:100%;max-width:560px;background:var(--surface);
  border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));
}
.sheet-box h3{margin:0 0 4px;font-size:17px}
.sheet-box p{margin:0 0 14px;color:var(--muted);font-size:13px}
.field{
  width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;
  padding:13px 14px;color:var(--text);font-size:16px;font-family:var(--sans);
}
.field:focus{outline:none;border-color:var(--accent)}
.sheet-actions{display:flex;gap:9px;margin-top:14px}
.btn{flex:1;height:48px;border-radius:9px;font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:center}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--raised);color:var(--text)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.grid2{display:flex;gap:9px}
.grid2 .field{flex:1;min-width:0}
label.lbl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
select.field{appearance:none}

/* ---------- aviso ---------- */
.toast{
  position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:50;
  max-width:536px;margin:0 auto;background:var(--paper);color:#1A1F22;
  border-radius:11px;padding:11px 13px;display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 26px rgba(0,0,0,.45);
}
.toast[hidden]{display:none}
.toast .t-txt{flex:1;font-size:14px;min-width:0}
.toast .t-amt{font-family:var(--mono);font-weight:700}
.toast button{font-size:13px;font-weight:600;padding:6px 9px;border-radius:7px;background:rgba(0,0,0,.08)}

footer{max-width:560px;margin:0 auto;padding:22px 16px 12px;display:flex;gap:9px}
footer button{flex:1;font-size:11.5px;color:var(--muted);padding:11px;border-radius:9px;background:var(--surface)}
.segbar{display:flex;background:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:3px;margin-bottom:13px}
.segbar button{flex:1;padding:9px 0;border-radius:7px;font-size:14px;color:var(--muted)}
.segbar button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.segbar button[data-k="i"][aria-pressed="true"]{background:#12463A;color:#8FE6C8}
.amt.in,.t-amt.in,.v.in{color:#4ECFA8}
.v.neg{color:var(--danger)}
.ticket-in{display:block;text-align:right;font-family:var(--mono);font-size:12px;color:#4ECFA8;margin-top:1px}
.bal{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;font-size:14px}
.bal+.bal{border-top:1px solid var(--line)}
.bal .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bal.total{font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <div class="period" id="period">Hoy</div>
      <div class="total" id="total">0,00 €</div>
      <div class="sub" id="subtotal"></div>
    </div>
    <div class="nav-arrows" id="arrows" hidden>
      <button id="prev" aria-label="Periodo anterior">‹</button>
      <button id="next" aria-label="Periodo siguiente">›</button>
    </div>
  </div>
  <nav>
    <button data-view="dias" aria-current="true">Días</button>
    <button data-view="semana">Semana</button>
    <button data-view="mes">Mes</button>
  </nav>
</header>

<main id="main"></main>

<footer>
  <button id="csv">Exportar CSV</button>
  <button id="export">Copia de seguridad</button>
  <button id="import">Restaurar</button>
  <input type="file" id="file" accept="application/json" hidden>
</footer>

<div class="dock">
  <div class="dock-inner">
    <button class="mic" id="mic" data-listening="false">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
        <path d="M17.9 11a1 1 0 1 0-2 0 3.9 3.9 0 0 1-7.8 0 1 1 0 1 0-2 0 5.9 5.9 0 0 0 4.9 5.8V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.2a5.9 5.9 0 0 0 4.9-5.8z"/>
      </svg>
      <span id="micLabel">Dictar</span>
    </button>
    <button class="type" id="typeBtn" aria-label="Escribir apunte">⌨</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-box">
    <h3 id="sheetTitle">Nuevo gasto</h3>
    <p id="sheetHint">Escríbelo tal como lo dirías, o usa el micrófono del teclado.</p>
    <div class="segbar" id="kindSel">
      <button data-k="g" aria-pressed="true">Gasto</button>
      <button data-k="i" aria-pressed="false">Ingreso</button>
    </div>
    <input class="field" id="raw" placeholder="12,40 en el súper" autocomplete="off" enterkeyhint="done">
    <div id="editFields" hidden>
      <label class="lbl" for="fAmt">Importe y categoría</label>
      <div class="grid2">
        <input class="field" id="fAmt" inputmode="decimal" placeholder="0,00">
        <select class="field" id="fCat"></select>
      </div>
      <label class="lbl" for="fDesc">Concepto</label>
      <input class="field" id="fDesc" autocomplete="off">
      <label class="lbl" for="fDate">Fecha</label>
      <input class="field" id="fDate" type="date">
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancel">Cancelar</button>
      <button class="btn btn-primary" id="confirm">Guardar</button>
    </div>
    <div class="sheet-actions" id="delWrap" hidden>
      <button class="btn btn-danger" id="del">Borrar este gasto</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden>
  <div class="t-txt" id="toastTxt"></div>
  <button id="undo">Deshacer</button>
  <button id="fix">Editar</button>
</div>

<script>
/* =================================================================
   Datos. Todo vive en el teléfono: nada sale a ninguna red.
   Cada apunte lleva k: 'g' gasto, 'i' ingreso.
   ================================================================= */
const KEY = 'gastos.v1';
let data = [];
try { data = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { data = []; }
data.forEach(e => { if (!e.k) e.k = 'g'; });          // apuntes antiguos = gastos
const persist = () => localStorage.setItem(KEY, JSON.stringify(data));

const CATS = {
  comida:     { label:'Comida',     color:'#F5A524' },
  transporte: { label:'Transporte', color:'#4EA8DE' },
  hogar:      { label:'Hogar',      color:'#7DBE7A' },
  ocio:       { label:'Ocio',       color:'#C77DFF' },
  salud:      { label:'Salud',      color:'#E5748A' },
  compras:    { label:'Compras',    color:'#5BC8B0' },
  otros:      { label:'Otros',      color:'#8397A4' }
};
const INCS = {
  nomina:     { label:'Nómina',         color:'#4ECFA8' },
  ventas:     { label:'Ventas',         color:'#4EA8DE' },
  alquileres: { label:'Alquileres',     color:'#E8B14A' },
  reembolso:  { label:'Reembolsos',     color:'#9BD46A' },
  extra:      { label:'Otros ingresos', color:'#8397A4' }
};
const info = e => (e.k === 'i' ? INCS[e.c] || INCS.extra : CATS[e.c] || CATS.otros);

/* Palabras que asignan categoría. Añade las tuyas aquí. */
const KEYWORDS = {
  comida:     ['super','supermercado','mercadona','lidl','carrefour','aldi','dia','compra','comida','restaurante','menu','cena','comer','desayuno','almuerzo','cafe','cafeteria','pizza','panaderia','pan','carniceria','pescaderia','fruteria','bocadillo','tapas','helado','kebab','burger','hamburguesa'],
  transporte: ['gasolina','gasolinera','diesel','repostar','metro','bus','autobus','taxi','uber','cabify','parking','aparcamiento','peaje','tren','renfe','billete','itv','taller','coche','moto','bici','patinete','vuelo','avion'],
  hogar:      ['alquiler','hipoteca','luz','electricidad','agua','gas','internet','wifi','fibra','movil','telefono','comunidad','seguro','ferreteria','ikea','muebles','limpieza','basura','ibi','reforma','fontanero','electricista'],
  ocio:       ['cine','teatro','concierto','libro','videojuego','juego','netflix','spotify','hbo','disney','gimnasio','padel','futbol','copas','cerveza','vino','bar','discoteca','viaje','hotel','museo','entrada','suscripcion'],
  salud:      ['farmacia','medico','dentista','optica','gafas','lentillas','medicamento','pastillas','fisio','fisioterapeuta','analitica','psicologo','veterinario'],
  compras:    ['ropa','camiseta','pantalon','zapatos','zapatillas','zara','amazon','regalo','tecnologia','ordenador','portatil','auriculares','cargador','perfume','peluqueria','barbero','libreria','papeleria']
};
const INC_KEYWORDS = {
  nomina:     ['nomina','sueldo','salario','paga','nominas'],
  ventas:     ['venta','ventas','vendido','vendi','cliente','encargo','trabajo','freelance'],
  reembolso:  ['devolucion','devuelto','reembolso','hacienda','irpf','abono','indemnizacion'],

  /* ---------------------------------------------------------------
     ALQUILERES. Escribe aqui los nombres de tus inquilinos, en
     minusculas y sin acentos, separados por comas y entre comillas.
     Ejemplo:  'margarita','jose luis','ana'
     Los nombres de dos palabras van juntos entre unas mismas comillas.
     --------------------------------------------------------------- */
  alquileres: ['alquiler','alquileres','renta','inquilino','inquilinos','mensualidad',
               'piso','local','garaje','plaza','trastero'
               /* <-- anade aqui los nombres, precedidos de coma */ ]
};
/* Si aparece una de estas, el apunte es un ingreso. */
const INC_TRIGGERS = ['ingreso','ingresado','ingrese','ingresaron','cobrado','cobre','cobro','recibido',
  'nomina','sueldo','salario','paga','devolucion','devuelto','reembolso','vendido','venta','abono'];

/* =================================================================
   Interpretación de la frase. Todo el proceso es local.
   ================================================================= */
const NUMS = {
  cero:0, un:1, uno:1, una:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7,
  ocho:8, nueve:9, diez:10, once:11, doce:12, trece:13, catorce:14, quince:15,
  dieciseis:16, diecisiete:17, dieciocho:18, diecinueve:19, veinte:20,
  veintiuno:21, veintiun:21, veintiuna:21, veintidos:22, veintitres:23,
  veinticuatro:24, veinticinco:25, veintiseis:26, veintisiete:27,
  veintiocho:28, veintinueve:29, treinta:30, cuarenta:40, cincuenta:50,
  sesenta:60, setenta:70, ochenta:80, noventa:90, cien:100, ciento:100,
  doscientos:200, trescientos:300, cuatrocientos:400, quinientos:500,
  seiscientos:600, setecientos:700, ochocientos:800, novecientos:900, mil:1000
};
const FILLER = new Set(['euros','euro','eur','centimos','centimo','con','y','de','del','en','el',
  'la','los','las','por','he','has','han','gastado','gasto','gastos','pagado','pague','me',
  'ha','costado','cuesta','al','a','lo','un','una','unos','unas','para','fue','son','es','€',
  'ingreso','ingresado','ingrese','ingresaron','cobrado','cobre','cobro','recibido',
  'hace','dia','dias','semana','semanas','pasado','pasada']);

const WEEK = { domingo:0, lunes:1, martes:2, miercoles:3, jueves:4, viernes:5, sabado:6 };
const MES  = { enero:0, febrero:1, marzo:2, abril:3, mayo:4, junio:5, julio:6,
               agosto:7, septiembre:8, setiembre:8, octubre:9, noviembre:10, diciembre:11 };

const norm = s => s.toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^\w\s,.€]/g,' ').replace(/\s+/g,' ').trim();

/* Convierte una secuencia de palabras-número en una cifra (0-9999). */
function wordsToNumber(tokens){
  let total = 0, cur = 0, used = 0;
  for (const t of tokens){
    if (t === 'y' && used > 0){ used++; continue; }
    const v = NUMS[t];
    if (v === undefined) break;
    if (v === 1000){ cur = (cur || 1) * 1000; total += cur; cur = 0; }
    else cur += v;
    used++;
  }
  if (used === 0) return null;
  while (tokens[used-1] === 'y') used--;
  return { value: total + cur, used };
}

/* Extrae el importe y devuelve el resto de la frase. */
function extractAmount(tokens){
  for (let i = 0; i < tokens.length; i++){
    const m = tokens[i].match(/^(\d+)(?:[.,](\d{1,2}))?$/);
    if (!m) continue;
    let value = parseInt(m[1], 10);
    let take = 1;
    if (m[2]) value += parseInt(m[2].padEnd(2,'0'), 10) / 100;
    else {
      const nxt = tokens[i+1] === 'con' ? tokens[i+2] : tokens[i+1];
      if (nxt && tokens[i+1] === 'con'){
        const c = /^\d{1,2}$/.test(nxt) ? parseInt(nxt,10)
                : (NUMS[nxt] !== undefined && NUMS[nxt] < 100 ? NUMS[nxt] : null);
        if (c !== null){ value += c/100; take = 3; }
      }
    }
    return { amount: value, rest: tokens.slice(0,i).concat(tokens.slice(i+take)) };
  }
  for (let i = 0; i < tokens.length; i++){
    const r = wordsToNumber(tokens.slice(i));
    if (!r || r.value === 0) continue;
    let value = r.value, take = r.used;
    if (tokens[i+r.used] === 'con'){
      const c = wordsToNumber(tokens.slice(i + r.used + 1));
      if (c && c.value < 100){ value += c.value/100; take += 1 + c.used; }
    }
    return { amount: value, rest: tokens.slice(0,i).concat(tokens.slice(i+take)) };
  }
  return { amount: null, rest: tokens };
}

/* Saca la fecha de la frase y devuelve el resto.
   Entiende: hoy, ayer, anteayer, hace N dias/semanas,
   los dias de la semana, "el dia 25" y "25 de julio". */
function extractDate(tokens){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const sin = i => tokens.slice(0,i).concat(tokens.slice(i+1));
  const menos = n => { const d = new Date(hoy); d.setDate(d.getDate()-n); return d; };
  let i;

  i = tokens.indexOf('hoy');
  if (i >= 0) return { date: hoy, rest: sin(i) };
  i = tokens.indexOf('ayer');
  if (i >= 0) return { date: menos(1), rest: sin(i) };
  i = tokens.indexOf('anteayer');
  if (i >= 0) return { date: menos(2), rest: sin(i) };

  // hace tres dias / hace 2 semanas
  i = tokens.indexOf('hace');
  if (i >= 0){
    const t = tokens[i+1] || '';
    const r = /^\d+$/.test(t) ? { value:+t, used:1 } : wordsToNumber(tokens.slice(i+1));
    if (r && r.value > 0){
      const u = tokens[i+1+r.used];
      let n = 0;
      if (u === 'dia' || u === 'dias')       n = r.value;
      if (u === 'semana' || u === 'semanas') n = r.value * 7;
      if (n > 0)
        return { date: menos(n), rest: tokens.slice(0,i).concat(tokens.slice(i+2+r.used)) };
    }
  }

  // 25 de julio  |  dia 25
  for (let k = 0; k < tokens.length; k++){
    if (!/^\d{1,2}$/.test(tokens[k])) continue;
    const n = +tokens[k];
    if (n < 1 || n > 31) continue;

    if (tokens[k+1] === 'de' && MES[tokens[k+2]] !== undefined){
      const d = new Date(hoy.getFullYear(), MES[tokens[k+2]], n);
      if (d > hoy) d.setFullYear(d.getFullYear()-1);      // aun no ha llegado: fue el año pasado
      return { date: d, rest: tokens.slice(0,k).concat(tokens.slice(k+3)) };
    }
    if (tokens[k-1] === 'dia'){
      const d = new Date(hoy.getFullYear(), hoy.getMonth(), n);
      if (d > hoy) d.setMonth(d.getMonth()-1);            // aun no ha llegado: fue el mes pasado
      return { date: d, rest: tokens.slice(0,k-1).concat(tokens.slice(k+1)) };
    }
  }

  // el lunes, el viernes... siempre hacia atras
  for (let k = 0; k < tokens.length; k++){
    const w = WEEK[tokens[k]];
    if (w === undefined) continue;
    return { date: menos((hoy.getDay() - w + 7) % 7), rest: sin(k) };
  }

  return { date: null, rest: tokens };
}

function matchCat(tokens, table, fallback){
  for (const t of tokens)
    for (const [cat, words] of Object.entries(table))
      if (words.includes(t)) return cat;
  return fallback;
}

function parse(text){
  let tokens = norm(text).split(' ').filter(Boolean);

  const kind = tokens.some(t => INC_TRIGGERS.includes(t)) ? 'i' : 'g';

  const fecha = extractDate(tokens);
  tokens = fecha.rest;

  const { amount, rest } = extractAmount(tokens);
  const cat = kind === 'i' ? matchCat(rest, INC_KEYWORDS, 'extra')
                           : matchCat(rest, KEYWORDS, 'otros');
  const desc = rest.filter(t => !FILLER.has(t)).join(' ');
  const label = kind === 'i' ? INCS[cat].label : CATS[cat].label;

  return {
    amount, cat, kind, date: fecha.date,
    desc: desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : label
  };
}

/* =================================================================
   Utilidades de fecha y formato
   ================================================================= */
const eur = n => n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + eur(Math.abs(n));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const DAYS = ['dom','lun','mar','mié','jue','vie','sáb'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function mondayOf(d){
  const x = new Date(d);
  x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function dayLabel(isoStr){
  const [y,m,dd] = isoStr.split('-').map(Number);
  const d = new Date(y, m-1, dd);
  const today = iso(new Date());
  const yest  = iso(new Date(Date.now() - 864e5));
  if (isoStr === today) return 'Hoy';
  if (isoStr === yest)  return 'Ayer';
  return `${DAYS[d.getDay()]} ${dd} ${MONTHS[m-1].slice(0,3)}`;
}
const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =================================================================
   Vistas
   ================================================================= */
let view = 'dias';
let offset = 0;

const $ = id => document.getElementById(id);
const main = $('main');

/* Devuelve gastos, ingresos y sus desgloses para un rango de fechas. */
function rangeTotals(from, to){
  const items = data.filter(e => e.d >= from && e.d <= to);
  let gastos = 0, ingresos = 0;
  const byCat = {}, byInc = {};
  for (const e of items){
    if (e.k === 'i'){ ingresos += e.a; byInc[e.c] = (byInc[e.c] || 0) + e.a; }
    else            { gastos   += e.a; byCat[e.c] = (byCat[e.c] || 0) + e.a; }
  }
  return { items, gastos, ingresos, saldo: ingresos - gastos, byCat, byInc };
}

function render(){
  $('arrows').hidden = (view === 'dias');
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.view === view)));
  if (view === 'dias')   renderDays();
  if (view === 'semana') renderWeek();
  if (view === 'mes')    renderMonth();
}

function rowHtml(e){
  const c = info(e);
  return `<button class="row" data-id="${e.id}">
      <span class="cat" style="background:${c.color}"></span>
      <span class="name">${escapeHtml(e.x)}</span>
      <span class="lead"></span>
      <span class="amt${e.k === 'i' ? ' in' : ''}">${e.k === 'i' ? '+' : ''}${eur(e.a)}</span>
    </button>`;
}

function renderDays(){
  const sorted = [...data].sort((a,b) => b.t - a.t);
  const today = iso(new Date());
  const t = rangeTotals(today, today);

  $('period').textContent = 'Hoy';
  $('total').textContent  = eur(t.gastos);
  $('subtotal').textContent = t.ingresos
    ? `Ingresos ${eur(t.ingresos)} · saldo ${signed(t.saldo)}`
    : (data.length ? `${data.length} apunte${data.length===1?'':'s'} registrado${data.length===1?'':'s'}` : '');

  if (!sorted.length){
    main.innerHTML = `<div class="empty"><strong>Aún no hay nada anotado</strong>
      Pulsa el micrófono y di algo como «doce con cuarenta en el súper»
      o «me han ingresado mil doscientos de nómina».</div>`;
    return;
  }

  const byDay = {};
  for (const e of sorted) (byDay[e.d] = byDay[e.d] || []).push(e);

  main.innerHTML = Object.keys(byDay).sort().reverse().slice(0,60).map(d => {
    const items = byDay[d];
    const g = items.filter(e => e.k !== 'i').reduce((s,e) => s + e.a, 0);
    const i = items.filter(e => e.k === 'i').reduce((s,e) => s + e.a, 0);
    return `<div class="ticket">
      <div class="ticket-head">
        <span class="ticket-day">${dayLabel(d)}</span>
        <span>
          <span class="ticket-sum">${eur(g)}</span>
          ${i ? `<span class="ticket-in">+${eur(i)}</span>` : ''}
        </span>
      </div>
      <div class="rows">${items.map(rowHtml).join('')}</div>
    </div><div class="tear"></div>`;
  }).join('');
}

function balanceHtml(t){
  if (!t.ingresos) return '';
  return `<div class="panel"><h2>Balance</h2>
    <div class="bal"><span>Ingresos</span><span class="v in">+${eur(t.ingresos)}</span></div>
    <div class="bal"><span>Gastos</span><span class="v">−${eur(t.gastos)}</span></div>
    <div class="bal total"><span>Saldo</span>
      <span class="v ${t.saldo >= 0 ? 'in' : 'neg'}">${signed(t.saldo)}</span></div>
  </div>`;
}

function breakdownHtml(by, total, title, table){
  const rows = Object.entries(by).sort((a,b) => b[1] - a[1]);
  if (!rows.length) return '';
  return `<div class="panel"><h2>${title}</h2>${rows.map(([c,v]) => `
    <div class="bar-row">
      <div class="bar-top">
        <span class="bar-name">${(table[c] || table.otros || table.extra).label}</span>
        <span><span class="bar-val">${eur(v)}</span><span class="bar-pct">${Math.round(v/total*100)}%</span></span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${(v/total*100).toFixed(1)}%;background:${(table[c] || table.otros || table.extra).color}"></div></div>
    </div>`).join('')}</div>`;
}

function renderWeek(){
  const start = mondayOf(new Date());
  start.setDate(start.getDate() + offset*7);
  const end = new Date(start); end.setDate(end.getDate() + 6);
  const t = rangeTotals(iso(start), iso(end));

  $('period').textContent = offset === 0 ? 'Esta semana'
    : `${start.getDate()} ${MONTHS[start.getMonth()].slice(0,3)} – ${end.getDate()} ${MONTHS[end.getMonth()].slice(0,3)}`;
  $('total').textContent = eur(t.gastos);
  $('subtotal').textContent = t.ingresos
    ? `Ingresos ${eur(t.ingresos)} · saldo ${signed(t.saldo)}`
    : (t.gastos ? `${eur(t.gastos/7)} al día de media` : 'Sin apuntes');
  $('next').disabled = offset >= 0;

  const perDay = [];
  for (let i = 0; i < 7; i++){
    const d = new Date(start); d.setDate(d.getDate() + i);
    perDay.push({ label: DAYS[d.getDay()], v: rangeTotals(iso(d), iso(d)).gastos });
  }
  const max = Math.max(...perDay.map(d => d.v), 1);

  main.innerHTML = `
    ${balanceHtml(t)}
    <div class="panel">
      <h2>Gasto por día</h2>
      <div class="spark">${perDay.map(d =>
        `<div class="${d.v>0?'on':''}" style="height:${Math.max(3,(d.v/max)*100)}%" title="${eur(d.v)}"></div>`).join('')}</div>
      <div class="spark-labels">${perDay.map(d => `<span>${d.label}</span>`).join('')}</div>
    </div>
    ${breakdownHtml(t.byCat, t.gastos, 'Gastos por categoría', CATS)}
    ${breakdownHtml(t.byInc, t.ingresos, 'Ingresos por origen', INCS)}
    ${t.gastos || t.ingresos ? '' : '<div class="empty">Nada anotado en esta semana.</div>'}`;
}

function renderMonth(){
  const now = new Date();
  const ref = new Date(now.getFullYear(), now.getMonth() + offset, 1);
  const start = iso(ref);
  const end   = iso(new Date(ref.getFullYear(), ref.getMonth() + 1, 0));
  const t = rangeTotals(start, end);

  $('period').textContent = `${MONTHS[ref.getMonth()]} ${ref.getFullYear()}`;
  $('total').textContent = eur(t.gastos);
  const days = new Date(ref.getFullYear(), ref.getMonth()+1, 0).getDate();
  $('subtotal').textContent = t.ingresos
    ? `Ingresos ${eur(t.ingresos)} · saldo ${signed(t.saldo)}`
    : (t.gastos ? `${eur(t.gastos/days)} al día de media` : 'Sin apuntes');
  $('next').disabled = offset >= 0;

  const weeks = [];
  let cur = mondayOf(ref);
  while (iso(cur) <= end){
    const wEnd = new Date(cur); wEnd.setDate(wEnd.getDate() + 6);
    const from = iso(cur) < start ? start : iso(cur);
    const to   = iso(wEnd) > end ? end : iso(wEnd);
    weeks.push({ v: rangeTotals(from, to).gastos });
    cur.setDate(cur.getDate() + 7);
  }
  const maxW = Math.max(...weeks.map(w => w.v), 1);

  main.innerHTML = `
    ${balanceHtml(t)}
    ${breakdownHtml(t.byCat, t.gastos, 'Gastos por categoría', CATS)}
    ${breakdownHtml(t.byInc, t.ingresos, 'Ingresos por origen', INCS)}
    <div class="panel">
      <h2>Gasto semana a semana</h2>
      ${weeks.map((w,i) => `
        <div class="bar-row">
          <div class="bar-top">
            <span class="bar-name">Semana ${i+1}</span>
            <span class="bar-val">${eur(w.v)}</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${(w.v/maxW*100).toFixed(1)}%;background:var(--accent)"></div></div>
        </div>`).join('')}
    </div>
    ${t.gastos || t.ingresos ? '' : '<div class="empty">Nada anotado en este mes.</div>'}`;
}

/* =================================================================
   Alta y edición
   ================================================================= */
let lastId = null;
let editingId = null;
let sheetKind = 'g';
let kindTouched = false;   // ¿ha tocado el usuario el selector?

function add(p){
  const d = p.date ? new Date(p.date) : new Date();
  const e = { id: Date.now() + '' + Math.floor(Math.random()*1000),
              t: Date.now(), d: iso(d), a: p.amount, c: p.cat, x: p.desc, k: p.kind || 'g' };
  data.push(e);
  persist();
  lastId = e.id;
  render();
  showToast(e);
  return e;
}

function showToast(e){
  $('toastTxt').innerHTML =
    `<span class="t-amt${e.k==='i'?' in':''}">${e.k==='i'?'+':''}${eur(e.a)}</span> · ${escapeHtml(e.x)}`;
  $('toast').hidden = false;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { $('toast').hidden = true; }, 6000);
}

$('undo').onclick = () => {
  data = data.filter(e => e.id !== lastId);
  persist(); render();
  $('toast').hidden = true;
};
$('fix').onclick = () => { $('toast').hidden = true; openSheet(lastId); };

function fillCats(kind){
  const table = kind === 'i' ? INCS : CATS;
  $('fCat').innerHTML = Object.entries(table)
    .map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('');
}

function setKind(k){
  sheetKind = k;
  document.querySelectorAll('#kindSel button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.k === k)));
  $('raw').placeholder = k === 'i' ? '1200 de nómina' : '12,40 en el súper';
  fillCats(k);
}

function openSheet(id){
  editingId = id || null;
  const editing = !!id;
  const e = editing ? data.find(x => x.id === id) : null;
  if (editing && !e) return;

  kindTouched = false;
  setKind(editing ? e.k : 'g');
  $('sheetTitle').textContent = editing
    ? (e.k === 'i' ? 'Editar ingreso' : 'Editar gasto')
    : 'Nuevo apunte';
  $('sheetHint').textContent = editing
    ? 'Corrige lo que haga falta.'
    : 'Escríbelo tal como lo dirías, o usa el micrófono del teclado.';
  $('raw').hidden        = editing;
  $('editFields').hidden = !editing;
  $('delWrap').hidden    = !editing;
  $('raw').value = '';

  if (editing){
    $('fAmt').value  = e.a.toFixed(2).replace('.',',');
    $('fCat').value  = e.c;
    $('fDesc').value = e.x;
    $('fDate').value = e.d;
  }
  $('sheet').hidden = false;
  setTimeout(() => (editing ? $('fAmt') : $('raw')).focus(), 60);
}
function closeSheet(){ $('sheet').hidden = true; editingId = null; }

document.querySelectorAll('#kindSel button').forEach(b => {
  b.onclick = () => {
    const prev = sheetKind;
    kindTouched = true;
    setKind(b.dataset.k);
    if (editingId && prev !== sheetKind){
      const e = data.find(x => x.id === editingId);
      e.k = sheetKind;
      e.c = sheetKind === 'i' ? 'extra' : 'otros';
      $('fCat').value = e.c;
    }
  };
});

$('typeBtn').onclick = () => openSheet(null);
$('cancel').onclick  = closeSheet;
$('sheet').onclick   = ev => { if (ev.target === $('sheet')) closeSheet(); };

$('confirm').onclick = () => {
  if (editingId){
    const e = data.find(x => x.id === editingId);
    const v = parseFloat($('fAmt').value.replace(',','.'));
    if (!isFinite(v) || v <= 0){ $('fAmt').focus(); return; }
    e.a = v; e.k = sheetKind; e.c = $('fCat').value;
    e.x = $('fDesc').value.trim() || info(e).label;
    if ($('fDate').value) e.d = $('fDate').value;
    persist(); render(); closeSheet();
  } else {
    const p = parse($('raw').value);
    if (p.amount === null || p.amount <= 0){
      $('sheetHint').textContent = 'No he encontrado un importe. Escribe la cifra, por ejemplo «8,50 en el bar».';
      $('raw').focus();
      return;
    }
    // el texto manda, salvo que el usuario haya tocado el selector a mano
    if (kindTouched && p.kind !== sheetKind){
      p.kind = sheetKind;
      p.cat  = sheetKind === 'i' ? 'extra' : 'otros';
    }
    closeSheet();
    add(p);
  }
};
$('raw').addEventListener('keydown', ev => { if (ev.key === 'Enter') $('confirm').click(); });

$('del').onclick = () => {
  data = data.filter(x => x.id !== editingId);
  persist(); render(); closeSheet();
};

main.addEventListener('click', ev => {
  const row = ev.target.closest('.row');
  if (row) openSheet(row.dataset.id);
});

/* =================================================================
   Dictado
   ================================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;

if (!SR){
  $('micLabel').textContent = 'Anotar';
  $('mic').onclick = () => openSheet(null);
} else {
  rec = new SR();
  rec.lang = 'es-ES';
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  rec.onresult = ev => {
    const text = ev.results[0][0].transcript;
    const p = parse(text);
    if (p.amount === null || p.amount <= 0){
      openSheet(null);
      $('raw').value = text;
      $('sheetHint').textContent = 'No he pillado el importe. Corrígelo y guarda.';
    } else add(p);
  };
  rec.onerror = ev => {
    stopUI();
    if (ev.error === 'not-allowed'){
      $('micLabel').textContent = 'Sin permiso de micrófono';
    } else if (ev.error === 'network'){
      openSheet(null);
      $('sheetHint').textContent = 'El dictado del navegador necesita conexión. Escríbelo, o usa el micrófono del teclado.';
    }
  };
  rec.onend = stopUI;

  $('mic').onclick = () => {
    if (listening){ rec.stop(); return; }
    try { rec.start(); listening = true;
          $('mic').dataset.listening = 'true';
          $('micLabel').textContent = 'Escuchando…'; }
    catch(e){ stopUI(); }
  };
}
function stopUI(){
  listening = false;
  $('mic').dataset.listening = 'false';
  $('micLabel').textContent = 'Dictar';
}

/* =================================================================
   Copia de seguridad
   ================================================================= */
/* Hoja de cálculo: separador ; y coma decimal, como espera el Excel español.
   El BOM del principio es lo que hace que Excel respete los acentos. */
function toCSV(){
  const head = 'Fecha;Tipo;Importe;Categoria;Concepto';
  const rows = [...data]
    .sort((a,b) => a.d.localeCompare(b.d) || a.t - b.t)
    .map(e => [
      e.d,
      e.k === 'i' ? 'Ingreso' : 'Gasto',
      e.a.toFixed(2).replace('.',','),
      info(e).label,
      String(e.x || '').replace(/[;\r\n]/g,' ')
    ].join(';'));
  return '\uFEFF' + [head, ...rows].join('\r\n');
}

/* Ofrece el archivo. En Android abre el menú de compartir (correo, Drive,
   WhatsApp); si el navegador no lo admite, lo descarga sin más. */
async function deliver(filename, mime, text){
  try {
    const file = new File([text], filename, { type: mime });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: filename });
      return;
    }
  } catch(e){
    if (e && e.name === 'AbortError') return;   // el usuario canceló
  }
  const blob = new Blob([text], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

$('csv').onclick = () => {
  if (!data.length){ flash('No hay nada que exportar todavía.'); return; }
  deliver(`gastos-${iso(new Date())}.csv`, 'text/csv', toCSV());
};

$('export').onclick = () => {
  if (!data.length){ flash('No hay nada que guardar todavía.'); return; }
  deliver(`gastos-${iso(new Date())}.json`, 'application/json', JSON.stringify(data,null,1));
};
function flash(msg){
  $('toastTxt').textContent = msg;
  $('toast').hidden = false;
  clearTimeout(flash._t);
  flash._t = setTimeout(() => ($('toast').hidden = true), 4000);
}

$('import').onclick = () => $('file').click();
$('file').onchange = ev => {
  const f = ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const incoming = JSON.parse(r.result);
      if (!Array.isArray(incoming)) throw 0;
      const ids = new Set(data.map(e => e.id));
      let added = 0;
      for (const e of incoming) if (!ids.has(e.id)){ if (!e.k) e.k = 'g'; data.push(e); added++; }
      persist(); render();
      flash(`${added} apunte${added===1?'':'s'} restaurado${added===1?'':'s'}`);
    } catch(e){
      flash('Ese archivo no es una copia válida.');
    }
  };
  r.readAsText(f);
  ev.target.value = '';
};

/* =================================================================
   Navegación
   ================================================================= */
document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => { view = b.dataset.view; offset = 0; render(); };
});
$('prev').onclick = () => { offset--; render(); };
$('next').onclick = () => { if (offset < 0){ offset++; render(); } };

if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(() => {});

setKind('g');
render();
</script>
</body>
